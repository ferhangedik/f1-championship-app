{% extends "base.html" %}
{% block title %}{{ 'Edit Driver' if action=='edit' else 'New Driver' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="page-title"><h1><i class="bi bi-person-gear text-f1"></i> {{ 'Edit Driver' if action=='edit' else 'Add New Driver' }}</h1></div>
    <div class="card">
      <div class="card-body">
        <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">First Name *</label>
              <input type="text" name="first_name" class="form-control" required value="{{ driver.first_name if driver else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Last Name *</label>
              <input type="text" name="last_name" class="form-control" required value="{{ driver.last_name if driver else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Date of Birth</label>
              <input type="date" name="date_of_birth" class="form-control" value="{{ driver.date_of_birth.isoformat() if driver and driver.date_of_birth else '' }}">
            </div>
            <div class="col-md-6">
              <label class="form-label">Nationality</label>
              <input type="text" name="nationality" class="form-control" value="{{ driver.nationality if driver else '' }}">
            </div>
            <div class="col-md-12">
              <label class="form-label">Team</label>
              <select name="team_id" class="form-select">
                <option value="">— No team —</option>
                {% for t in teams %}
                  <option value="{{ t.team_id }}" {% if driver and driver.team_id==t.team_id %}selected{% endif %}>{{ t.name }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="col-md-12">
              <label class="form-label">Photo URL</label>
              <input type="url" name="photo_url" class="form-control" value="{{ driver.photo_url if driver else '' }}">
            </div>
            <div class="col-md-12">
              <label class="form-label">Wikipedia URL</label>
              <input type="url" name="wiki_url" class="form-control" value="{{ driver.wiki_url if driver else '' }}">
            </div>
          </div>
          <div class="mt-4 d-flex gap-2">
            <button class="btn btn-f1">{{ 'Update' if action=='edit' else 'Add' }}</button>
            <a href="{{ url_for('admin.drivers') }}" class="btn btn-outline-light">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
