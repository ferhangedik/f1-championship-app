{% extends "base.html" %}
{% block title %}Drivers{% endblock %}

{% block content %}
<div class="page-title"><h1><i class="bi bi-person text-f1"></i> Drivers</h1></div>

<div class="row g-3">
  {% for d in drivers %}
  <div class="col-sm-6 col-lg-4 col-xl-3">
    <a href="{{ url_for('drivers.profile', driver_id=d.driver_id) }}" class="text-decoration-none">
      <div class="card h-100 driver-card">
        <div class="card-body d-flex align-items-center gap-3">
          <div class="text-center" style="min-width:44px">
            <i class="bi bi-person-circle" style="font-size:2.4rem; color:var(--f1-red)"></i>
          </div>
          <div>
            <div class="fw-bold text-white">{{ d.first_name }} {{ d.last_name }}</div>
            <div class="small text-muted">{{ d.team or 'No team' }}</div>
            <div class="small">{{ d.nationality or '—' }}</div>
          </div>
        </div>
      </div>
    </a>
  </div>
  {% else %}
  <p class="text-muted">No driver data.</p>
  {% endfor %}
</div>
{% endblock %}
