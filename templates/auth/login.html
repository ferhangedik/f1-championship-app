{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card mt-4">
      <div class="card-header"><i class="bi bi-box-arrow-in-right text-f1"></i> Log In</div>
      <div class="card-body">
        <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <button class="btn btn-f1 w-100">Log In</button>
        </form>
        <hr class="my-3" style="border-color:var(--f1-border)">
        <p class="text-center mb-0 small text-muted">Don't have an account? <a href="{{ url_for('auth.register') }}">Sign up</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
