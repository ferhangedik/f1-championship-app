{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card mt-4">
      <div class="card-header"><i class="bi bi-person-plus text-f1"></i> Sign Up</div>
      <div class="card-body">
        <form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" minlength="3" maxlength="40" required autofocus>
            <div class="form-text">At least 3 characters.</div>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-control" minlength="8" required>
            <div class="form-text">At least 8 characters. (No email required.)</div>
          </div>
          <button class="btn btn-f1 w-100">Sign Up</button>
        </form>
        <hr class="my-3" style="border-color:var(--f1-border)">
        <p class="text-center mb-0 small text-muted">Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
